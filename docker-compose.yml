services:
  bili-history:
    image: ghcr.io/felix2yu/bili-history:latest
    container_name: bili-history
    restart: unless-stopped
    volumes:
      - ./backend/config:/app/config
      - ./output:/app/output
    ports:
      - "8899:8899"
    environment:
      - TZ=Asia/Shanghai
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # 外部备份工具（docker-db-auto-backup）的 SQLite「应用自导出」约定。
      # 本容器是六个库（历史 / 动态 / 点赞 / 稍后再看 / 收藏 / 调度器），
      # 而工具的 full 模式是「一个容器一个文件」，所以 `bili-history backup`
      # 把每个库各做一份 VACUUM INTO 一致性快照，打包成同一个 zip 写到 stdout。
      #
      # BACKUP_SQLITE_EXT=zip 不能省：省略它，工具会拿 SQLite 魔数去校验一个 zip，
      # 校验失败 → 产物丢弃 → 本轮标记失败。这个失败模式是刻意的，
      # 为的是不允许把 zip 当 SQLite 悄悄存下来。
      #
      # 注意：挂载进来的 config.yaml 里有 B 站 Cookie / SESSDATA，属主是宿主机的你，
      # 它刻意不在备份产物内（见 README「备份与恢复」）。
      - BACKUP_SQLITE_CMD=bili-history backup
      - BACKUP_SQLITE_EXT=zip
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8899/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
