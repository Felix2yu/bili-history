name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  repository_dispatch:
    types: [base-image-updated]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: Felix2yu/.github/.github/workflows/reusable-test.yml@v1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      go-dir: .
      # database 包内有纯 Go 驱动守卫测试，必须纳入；
      # backup 包是 `bili-history backup` 的产物契约测试（zip / db / 缺库行为），同样不碰网络
      test-packages: ./internal/config/... ./internal/utils/... ./internal/models/... ./internal/database/... ./internal/backup/...
      web-dir: web
      # lint 纳入 CI：本仓 lint = eslint .，实测 exit=0（0 problems）。
      # 只有构建侧被验证过是不够的 —— typescript-eslint 对 TS 7 是加载期硬失败。
      web-lint-command: pnpm run lint
      # Nuxt 用 generate 而非 build，产物落在 .output/public
      web-build-command: pnpm run generate
      frontend-stage-command: |
        rm -rf internal/web/dist
        cp -r web/.output/public internal/web/dist

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: Felix2yu/.github/.github/workflows/reusable-image.yml@v1
    with:
      go-dir: .
      main-package: ./cmd/bili-history
      binary-name: bili-history
      image-name: ghcr.io/felix2yu/bili-history
      # SQLite 已换为纯 Go 驱动（modernc.org/sqlite），无需 cgo、可交叉编译；
      # database/driver_purego_test.go 守卫这一点
      web-dir: web
      web-build-command: pnpm run generate
      frontend-stage-command: |
        rm -rf internal/web/dist
        cp -r web/.output/public internal/web/dist

  release:
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: Felix2yu/.github/.github/workflows/reusable-release.yml@v1
    with:
      go-dir: .
      main-package: ./cmd/bili-history
      binary-name: bili-history
      web-dir: web
      web-build-command: pnpm run generate
      frontend-stage-command: |
        rm -rf internal/web/dist
        cp -r web/.output/public internal/web/dist
