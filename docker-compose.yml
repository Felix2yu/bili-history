services:
  bili-history:
    image: ghcr.io/felix2yu/bili-history:latest
    container_name: bili-history
    restart: unless-stopped
    volumes:
      - ./backend/config:/app/config
      - ./output:/app/output
    ports:
      - "8899:8899"
    environment:
      - TZ=Asia/Shanghai
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8899/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
