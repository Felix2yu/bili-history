services:
  bili-history:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/felix2yu/bili-history:local
    container_name: bili-history
    restart: unless-stopped
    volumes:
      - ./backend/config:/app/config
      - ./output:/app/output
    ports:
      - "8899:8899"
    environment:
      - TZ=Asia/Shanghai
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8899/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
