name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/felix2yu/bili-history

jobs:
  # 双架构原生 runner 矩阵预编译：前端产物通过 go:embed 嵌入 Go 二进制，
  # 使用 musl 工具链静态编译（sqlite3 走 CGO），产物可在 alpine 运行时直接执行。
  build:
    name: Precompile binary (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    goarch: amd64, label: amd64 }
          - { os: ubuntu-24.04-arm, goarch: arm64, label: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      # musl-gcc 让 CGO 产出静态链接的二进制，与 alpine 运行时 ABI 匹配
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run generate
        working-directory: frontend

      - name: Copy frontend dist into backend
        run: rm -rf backend/web/dist && cp -r frontend/.output/public backend/web/dist

      - name: Build backend binary
        run: >
          CC=musl-gcc CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.goarch }}
          go build -trimpath -ldflags="-s -w" -o bili-history ./cmd/main.go
        working-directory: backend

      # 上传该架构的预编译二进制，docker job 直接下载拼装，不再镜像内编译
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: bili-history-${{ matrix.label }}
          path: backend/bili-history
          retention-days: 7

  # 仅拼装运行时镜像：下载对应架构的预编译二进制，无 Node/pnpm、无 Go 编译
  docker:
    name: Assemble image (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest,    label: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, label: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download prebuilt binary
        uses: actions/download-artifact@v7
        with:
          name: bili-history-${{ matrix.label }}
          path: bin

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.label }}

  # 合并双架构镜像为最终 tag（latest / semver / dev / pr-N）
  docker-manifest:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}

      - name: Create and push manifest lists
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "Merging manifest for $tag"
            docker buildx imagetools create \
              --tag "$tag" \
              "${IMAGE}:amd64" \
              "${IMAGE}:arm64"
          done <<< "${{ steps.meta.outputs.tags }}"
