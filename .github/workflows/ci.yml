name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: Felix2yu/.github/.github/workflows/reusable-test.yml@v1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      go-dir: backend
      test-packages: ./config/... ./utils/... ./models/...
      # SQLite 走 mattn/go-sqlite3，测试期必须开 CGO
      test-cgo: '1'
      web-dir: frontend
      # Nuxt 用 generate 而非 build，产物落在 .output/public
      web-build-command: pnpm run generate
      frontend-stage-command: |
        rm -rf backend/web/dist
        cp -r frontend/.output/public backend/web/dist

  image:
    needs: test
    if: github.event_name != 'release'
    permissions:
      contents: read
      packages: write
    uses: Felix2yu/.github/.github/workflows/reusable-image.yml@v1
    with:
      go-dir: backend
      main-package: ./cmd
      binary-name: bili-history
      image-name: ghcr.io/felix2yu/bili-history
      # 运行时镜像是 alpine，CGO 产物必须静态链接到 musl
      cgo: musl
      web-dir: frontend
      web-build-command: pnpm run generate
      frontend-stage-command: |
        rm -rf backend/web/dist
        cp -r frontend/.output/public backend/web/dist

  release:
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: Felix2yu/.github/.github/workflows/reusable-release.yml@v1
    with:
      go-dir: backend
      main-package: ./cmd
      binary-name: bili-history
      cgo: musl
      web-dir: frontend
      web-build-command: pnpm run generate
      frontend-stage-command: |
        rm -rf backend/web/dist
        cp -r frontend/.output/public backend/web/dist
