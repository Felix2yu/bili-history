name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: Felix2yu/.github/.github/workflows/reusable-test.yml@v1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      go-dir: backend
      # database 包内有纯 Go 驱动守卫测试，必须纳入
      test-packages: ./config/... ./utils/... ./models/... ./database/...
      web-dir: frontend
      # Nuxt 用 generate 而非 build，产物落在 .output/public
      web-build-command: pnpm run generate
      frontend-stage-command: |
        rm -rf backend/web/dist
        cp -r frontend/.output/public backend/web/dist

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: Felix2yu/.github/.github/workflows/reusable-image.yml@v1
    with:
      go-dir: backend
      main-package: ./cmd
      binary-name: bili-history
      image-name: ghcr.io/felix2yu/bili-history
      # SQLite 已换为纯 Go 驱动（modernc.org/sqlite），无需 cgo、可交叉编译；
      # database/driver_purego_test.go 守卫这一点
      web-dir: frontend
      web-build-command: pnpm run generate
      frontend-stage-command: |
        rm -rf backend/web/dist
        cp -r frontend/.output/public backend/web/dist

  release:
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: Felix2yu/.github/.github/workflows/reusable-release.yml@v1
    with:
      go-dir: backend
      main-package: ./cmd
      binary-name: bili-history
      web-dir: frontend
      web-build-command: pnpm run generate
      frontend-stage-command: |
        rm -rf backend/web/dist
        cp -r frontend/.output/public backend/web/dist
